<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>森の本棚｜暮らしの森 文庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ivory:#F6F1E4; --ivory-deep:#EFE7D3;
    --forest:#2F4A3D; --forest-deep:#22352C;
    --moss:#6E8A6E; --amber:#E8B463;
    --ink:#2B2620; --ink-soft:#57524A; --locked:#B9C2B3;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    min-height:100vh;
    background: radial-gradient(circle at 50% 0%, var(--ivory-deep), var(--ivory) 60%);
    font-family:'Zen Maru Gothic', sans-serif;
    color: var(--ink);
    padding: 36px 20px 64px;
  }
  .wrap{ max-width:680px; margin:0 auto; }
  header{ text-align:center; margin-bottom:24px; }
  .brand{
    border:none; background:none; padding:0; font-size:12px; letter-spacing:.25em;
    color:var(--moss); font-weight:500; cursor:pointer; font-family:inherit; display:block; margin:0 auto 10px;
  }
  h1.title{ font-family:'Shippori Mincho', serif; font-size:30px; font-weight:700; color:var(--forest-deep); margin:8px 0 10px; }
  p.sub{ font-size:13.5px; color:var(--ink-soft); line-height:1.7; margin:0 auto 18px; max-width:420px; }
  .series-hero{
    border-radius:16px; background-size:cover; background-position:center; padding:28px 20px; margin-bottom:16px;
    box-shadow:0 4px 16px rgba(43,38,32,.18);
  }
  .series-hero h1{ font-family:'Shippori Mincho', serif; font-size:24px; font-weight:700; color:#FFFDF7; margin:0 0 8px; text-shadow:0 1px 4px rgba(0,0,0,.4); }
  .series-hero p{ font-size:12.5px; color:#F3EFE2; line-height:1.7; margin:0 auto; max-width:400px; text-shadow:0 1px 3px rgba(0,0,0,.4); }
  .lantern-row{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; }
  .lantern{ font-size:16px; color:var(--amber); transition:all .6s ease; }
  .hub-link{
    display:inline-block; font-size:12px; color:var(--forest); background:#FFFDF7;
    border:1px solid rgba(110,138,110,.35); border-radius:999px; padding:6px 16px; text-decoration:none;
  }
  .search-wrap{
    display:flex; align-items:center; gap:8px; background:#FFFDF7; border:1px solid rgba(110,138,110,.27);
    border-radius:999px; padding:8px 16px; margin:0 auto 14px;
  }
  .search-wrap input{ flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:13.5px; color:var(--ink); }
  .search-icon{ color:var(--moss); font-size:14px; }
  .clear-btn{ border:none; background:transparent; color:var(--ink-soft); font-size:16px; cursor:pointer; line-height:1; }
  .back-btn{
    display:block; margin:0 auto 18px; border:none; background:none; color:var(--moss);
    font-size:12.5px; font-family:inherit; cursor:pointer; padding:0;
  }
  .cover-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; }
  .cover{
    aspect-ratio:3/4; border:none; border-radius:10px; padding:12px; display:flex; flex-direction:column;
    justify-content:flex-end; cursor:pointer; box-shadow:0 3px 10px rgba(43,38,32,.24);
    background-size:cover; background-position:center; position:relative; overflow:hidden; text-align:left;
  }
  .cover.locked{
    background:var(--locked); color:var(--ink-soft); cursor:default; box-shadow:none; opacity:.85;
    align-items:center; justify-content:center; gap:4px; text-align:center;
  }
  .weight-tag{ position:absolute; top:8px; left:8px; font-size:13px; }
  .cover-area{ font-family:'Shippori Mincho', serif; font-size:14px; font-weight:700; color:#FFFDF7; text-shadow:0 1px 3px rgba(0,0,0,.5); line-height:1.35; display:block; }
  .cover-char{ font-size:11px; color:#F3EFE2; text-shadow:0 1px 3px rgba(0,0,0,.5); display:block; }
  .cover-count{
    font-size:9.5px; color:#FFFDF7; opacity:.9; margin-top:3px; border:1px solid rgba(255,255,255,.55);
    border-radius:999px; padding:1px 7px; display:inline-block;
  }
  .cover-emoji{ font-size:26px; margin-bottom:2px; }
  .legend{ margin:14px auto 0; text-align:center; font-size:11.5px; color:var(--ink-soft); }
  .timeline{ position:relative; padding:4px 0; }
  .timeline-line{
    position:absolute; left:17px; top:4px; bottom:4px; width:2px;
    background:repeating-linear-gradient(180deg, rgba(110,138,110,.35) 0 6px, transparent 6px 12px); z-index:0;
  }
  .timeline-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; position:relative; z-index:1; }
  .timeline-badge{
    flex-shrink:0; width:36px; height:36px; border-radius:50%; color:#FFFDF7; display:flex; align-items:center;
    justify-content:center; font-size:12.5px; font-weight:700; box-shadow:0 2px 6px rgba(43,38,32,.2);
  }
  .timeline-badge.read{ box-shadow:0 0 0 3px rgba(232,180,99,.45); }
  .timeline-chip{
    flex:1; background:#FFFDF7; border:1px solid rgba(110,138,110,.2); border-radius:999px; padding:10px 18px;
    font-family:'Shippori Mincho', serif; font-size:13.5px; color:var(--forest-deep); text-decoration:none;
    box-shadow:0 1px 3px rgba(43,38,32,.05); display:block;
  }
  .timeline-chip.soon{ color:var(--ink-soft); background:#EFECE3; font-style:italic; cursor:default; }
  .spinoff-card{
    display:block; margin-top:16px; padding:12px 16px; background:#FBF3E0; border:1px solid rgba(232,180,99,.4);
    border-radius:10px; text-decoration:none;
  }
  .spinoff-label{ display:block; font-size:11px; color:var(--amber); font-weight:700; margin-bottom:4px; letter-spacing:.02em; }
  .spinoff-title{ display:block; font-family:'Shippori Mincho', serif; font-size:14px; color:var(--ink); }
  .list-wrap{ display:flex; flex-direction:column; gap:8px; }
  .list-row{
    display:flex; align-items:center; gap:10px; background:#FFFDF7; border:1px solid rgba(110,138,110,.2);
    border-radius:10px; padding:10px 14px; cursor:pointer; text-align:left; width:100%; font-family:inherit;
  }
  .list-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .list-text{ display:flex; flex-direction:column; flex:1; gap:2px; }
  .list-title{ font-family:'Shippori Mincho', serif; font-size:14px; color:var(--forest-deep); }
  .list-meta{ font-size:11px; color:var(--ink-soft); }
  .read-mark{ font-size:10.5px; color:var(--amber); border:1px solid var(--amber); border-radius:6px; padding:1px 6px; }
  .empty{ text-align:center; font-size:13px; color:var(--ink-soft); padding:24px 0; }
  .detail-wrap{ margin:22px auto 0; background:#FFFDF7; border-radius:14px; overflow:hidden; box-shadow:0 4px 16px rgba(43,38,32,.12); }
  .detail-band{ height:8px; }
  .detail-body{ padding:18px 20px; }
  .detail-meta{ font-size:11.5px; color:var(--moss); font-weight:500; }
  .detail-title{ font-family:'Shippori Mincho', serif; font-size:19px; margin:6px 0 14px; color:var(--forest-deep); }
  .stamp-prompt{ font-size:12px; color:var(--ink-soft); margin:0 0 8px; }
  .stamp-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .stamp-btn{
    display:flex; flex-direction:column; align-items:center; gap:2px; border:1px solid rgba(110,138,110,.27);
    background:transparent; border-radius:10px; padding:6px 10px; cursor:pointer; min-width:58px; font-family:inherit;
  }
  .stamp-btn.active{ background:rgba(232,180,99,.13); border-color:var(--amber); }
  .stamp-btn .glyph{ font-size:18px; }
  .stamp-btn .label{ font-size:9.5px; color:var(--ink-soft); }
  .close-btn{ border:none; background:none; color:var(--moss); font-size:12px; cursor:pointer; padding:0; font-family:inherit; }
  footer{ margin:48px auto 0; text-align:center; font-size:11.5px; color:var(--ink-soft); line-height:1.9; max-width:680px; }
</style>
</head>

  { key:"madam", emoji:"💰", area:"暮らしの講堂", character:"マダム・ザマス", weight:"📖", color:"#8C7A5B", cover:IMAGES.madam,
    tagline:"迷った人が最後に座る場所。帰る頃には、暮らしの仕組みが見えてくる。",
    episodes:[
      {t:"森で一番迷いをほどく人", u:"https://note.com/koyorimade/n/n8df9971fe957"},
      {t:"家計の鬼教官、森に現る", u:"https://note.com/koyorimade/n/n7e33b9dbb520"},
      {t:"家計講座を終えて", u:"https://note.com/koyorimade/n/nf176b957310e"},
      {t:"買い物は金額より後味", u:"https://note.com/koyorimade/n/nd3d6f7b8ef31"},
      {t:"集め過ぎた日の話（モコの宝物）", u:"https://note.com/koyorimade/n/n3b15ac4b07ae"}
    ],
    spinoff:{t:"家計講座 Day1〜7", u:"https://note.com/koyorimade/n/n33802b3d5609"} },

const LOCKED_AREA = { emoji:"⛲", area:"迷いの泉", character:"●●●",
  note:"迷いが深くなった時、静かに座っていると、水面に答えが浮かぶことがあるらしい。このエリアはまだ開放されていません。" };

const HUB_URL = "https://note.com/koyorimade/n/n317059ab513c";

const BOOKS = AREAS.flatMap((a) =>
  a.episodes.map((ep, i) => ({
    id: a.key + "-" + i, no: i + 1, title: ep.t, url: ep.u,
    character: a.character, area: a.area, emoji: a.emoji, color: a.color,
    tagline: a.tagline, areaKey: a.key
  }))
);

const STAMPS = [
  { key:"cry", label:"泣いた", glyph:"🌧" },
  { key:"warm", label:"ほっこりした", glyph:"🕯" },
  { key:"hot", label:"熱かった", glyph:"🍂" },
  { key:"laugh", label:"笑った", glyph:"🍃" },
  { key:"love", label:"好き", glyph:"🌙" }
];

const LANTERN_SLOTS = 8;

// ---- state ----
let state = {
  view: "home",
  query: "",
  readIds: new Set(),
  reactions: {},
  selectedId: null
};

function esc(s){
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));
}

function findArea(key){ return AREAS.find(a => a.key === key) || null; }
function findBook(id){ return BOOKS.find(b => b.id === id) || null; }

function searchResults(){
  const q = state.query.trim();
  if(!q) return null;
  return BOOKS.filter(b => b.title.includes(q) || b.character.includes(q) || b.area.includes(q));
}

function markRead(id){ state.readIds.add(id); }
function openDetail(id){ state.selectedId = id; markRead(id); render(); }
function setReaction(id, key){ state.reactions[id] = key; render(); }
function goHome(){ state.view = "home"; state.selectedId = null; state.query = ""; render(); }
function goSeries(key){ state.view = key; state.selectedId = null; state.query = ""; render(); }

function renderLanterns(){
  const lit = Math.min(state.readIds.size, LANTERN_SLOTS);
  let html = '<div class="lantern-row" aria-hidden="true">';
  for(let i = 0; i < LANTERN_SLOTS; i++){
    const on = i < lit;
    html += `<span class="lantern" style="opacity:${on ? 1 : 0.22};filter:${on ? 'drop-shadow(0 0 6px rgba(232,180,99,0.65))' : 'none'}">✦</span>`;
  }
  html += '</div>';
  return html;
}

function renderHeader(){
  const currentArea = findArea(state.view);
  const sr = searchResults();
  let inner = '<button class="brand" onclick="goHome()">暮らしの森 文庫</button>';

  if(currentArea && !sr){
    inner += `
      <div class="series-hero" style="background-image:linear-gradient(180deg, rgba(34,53,44,0.15), rgba(34,53,44,0.75)), url(${currentArea.cover})">
        <h1>${currentArea.emoji} ${esc(currentArea.area)}</h1>
        <p>${esc(currentArea.tagline)}</p>
      </div>`;
  } else {
    inner += `
      <h1 class="title">森の本棚</h1>
      <p class="sub">気になるエリアから、好きな順番で歩いてみてください。読んだ数はどこにも表示されません。灯りだけが、静かに増えていきます。</p>`;
  }

  inner += renderLanterns();

  if(state.view === "home" && !sr){
    inner += `<a class="hub-link" href="${HUB_URL}" target="_blank" rel="noopener noreferrer">🌳 森の案内所へ戻る（はじめての方はこちら）</a>`;
  }

  return `<header>${inner}</header>`;
}

function renderSearch(){
  return `
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="search-input" value="${esc(state.query)}" placeholder="タイトル・住人名でさがす" />
      ${state.query ? '<button class="clear-btn" onclick="clearQuery()" aria-label="検索をクリア">×</button>' : ""}
    </div>`;
}

function clearQuery(){ state.query = ""; render(); }

function renderBody(){
  const sr = searchResults();
  const currentArea = findArea(state.view);
  let html = "";

  if(currentArea && !sr){
    html += `<button class="back-btn" onclick="goHome()">← 本棚にもどる</button>`;
  }

  if(sr){
    html += '<main class="list-wrap">';
    if(sr.length === 0){
      html += '<p class="empty">この言葉では、まだ見つかりませんでした。別の名前で探してみてください。</p>';
    } else {
      sr.forEach(b => {
        const read = state.readIds.has(b.id);
        html += `
          <button class="list-row" onclick="openDetail('${b.id}')">
            <span class="list-dot" style="background:${b.color}"></span>
            <span class="list-text">
              <span class="list-title">${esc(b.title)}</span>
              <span class="list-meta">${b.emoji} ${esc(b.area)}｜${esc(b.character)}</span>
            </span>
            ${read ? '<span class="read-mark">既読</span>' : ""}
          </button>`;
      });
    }
    html += '</main>';
    return html;
  }

  if(state.view === "home"){
    html += '<main class="cover-grid">';
    AREAS.forEach(a => {
      html += `
        <button class="cover" style="background-image:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.78) 100%), url(${a.cover})" onclick="goSeries('${a.key}')">
          <span class="weight-tag">${a.weight}</span>
          <span>
            <span class="cover-area">${esc(a.area)}</span>
            <span class="cover-char">${esc(a.character)}</span>
            <span class="cover-count">全${a.episodes.length}話</span>
          </span>
        </button>`;
    });
    html += `
      <div class="cover locked">
        <span class="cover-emoji">${LOCKED_AREA.emoji}</span>
        <span class="cover-area">${esc(LOCKED_AREA.area)}</span>
        <span class="cover-char">${esc(LOCKED_AREA.character)}</span>
        <span class="cover-count">🔒 未解放</span>
      </div>`;
    html += '</main>';
    html += '<p class="legend">🌱 気軽に読める話が中心　📖 長編・腰を据えて読むならこちら</p>';
    return html;
  }

  if(currentArea){
    const books = BOOKS.filter(b => b.areaKey === currentArea.key);
    html += '<main><div class="timeline"><div class="timeline-line" aria-hidden="true"></div>';
    books.forEach(b => {
      const read = state.readIds.has(b.id);
      html += '<div class="timeline-row">';
      html += `<span class="timeline-badge ${read ? "read" : ""}" style="background:${read ? "var(--amber)" : b.color}">${read ? "✓" : b.no}</span>`;
      if(b.url){
        html += `<a class="timeline-chip" href="${b.url}" target="_blank" rel="noopener noreferrer" onclick="openDetail('${b.id}')">${esc(b.title)}</a>`;
      } else {
        html += `<span class="timeline-chip soon">${esc(b.title)}</span>`;
      }
      html += '</div>';
    });
    html += '</div>';

    if(currentArea.spinoff){
      html += `
        <a class="spinoff-card" href="${currentArea.spinoff.u}" target="_blank" rel="noopener noreferrer" onclick="markRead('${currentArea.key}-spinoff')">
          <span class="spinoff-label">📖 長編スピンオフ・まとめて読む用</span>
          <span class="spinoff-title">${esc(currentArea.spinoff.t)}</span>
        </a>`;
    }
    html += '</main>';
    return html;
  }

  return html;
}

function renderDetail(){
  const b = findBook(state.selectedId);
  if(!b) return "";
  const reaction = state.reactions[b.id];
  let stamps = "";
  STAMPS.forEach(s => {
    const active = reaction === s.key;
    stamps += `
      <button class="stamp-btn ${active ? "active" : ""}" onclick="setReaction('${b.id}','${s.key}')" aria-label="${s.label}" title="${s.label}">
        <span class="glyph">${s.glyph}</span>
        <span class="label">${s.label}</span>
      </button>`;
  });
  return `
    <div class="detail-wrap">
      <div class="detail-band" style="background:${b.color}"></div>
      <div class="detail-body">
        <span class="detail-meta">${b.emoji} ${esc(b.area)}｜${esc(b.character)}</span>
        <h2 class="detail-title">${esc(b.title)}</h2>
        <p class="stamp-prompt">${reaction ? "気持ちを届けました" : "読んだ気持ちを、ひとつだけ"}</p>
        <div class="stamp-row">${stamps}</div>
        <button class="close-btn" onclick="closeDetail()">閉じる</button>
      </div>
    </div>`;
}

function closeDetail(){ state.selectedId = null; render(); }

function renderFooter(){
  return `
    <footer>
      <p>この本棚に、通知もランキングもありません。</p>
      <p>ページを開いた人にだけ、森が育っていくのが見えます。</p>
    </footer>`;
}

function render(){
  const app = document.getElementById("app");
  app.innerHTML =
    renderHeader() +
    renderSearch() +
    renderBody() +
    renderDetail() +
    renderFooter();

  const input = document.getElementById("search-input");
  if(input){
    input.addEventListener("input", (e) => {
      state.query = e.target.value;
      render();
      const el = document.getElementById("search-input");
      if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
    });
  }
}

render();
</script>
</body>
</html>
