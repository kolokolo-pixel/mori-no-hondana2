const PLANNED_TOTAL = 20;

const INITIAL_COLLECTED = [];

function Stars({ n }) {
  return (
    <span style={{ letterSpacing: "1px" }}>
      {[0, 1, 2].map((i) => (
        <span key={i} style={{ color: i < n ? "#B5792E" : "#D9C7A6" }}>
          {i < n ? "●" : "○"}
        </span>
      ))}
    </span>
  );
}

function AcornIcon({ size = 14, color = "#8A5A2E" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none">
      <path d="M12 8c-3.2 0-5.6 1.9-5.6 4.6C6.4 16.4 9 21 12 21s5.6-4.6 5.6-8.4C17.6 9.9 15.2 8 12 8z" fill={color} />
      <path d="M6.2 8.4C6.2 5.8 8.7 3.6 12 3.6s5.8 2.2 5.8 4.8c0 .9-1.9 1.6-5.8 1.6s-5.8-.7-5.8-1.6z" fill="#5C7A45" />
      <path d="M12 3.6v1.6" stroke="#3E5A2E" strokeWidth="1" strokeLinecap="round" />
    </svg>
  );
}

function CardFace({ def, big }) {
  return (
    <div className={`cardFace ${big ? "cardFaceBig" : ""}`}>
      <img src={cardImages[def.id]} alt={def.name} className="cardArt" />
    </div>
  );
}

function CardBack({ mystery }) {
  return (
    <div className="cardBack">
      <div className="cardBackRing">
        <AcornIcon size={30} color="#7A5230" />
      </div>
      <div className="cardBackLabel">{mystery ? "？" : "未発見"}</div>
      <div className="cardBackSub">森のどこかに眠っている</div>
    </div>
  );
}

  const [codeError, setCodeError] = useState("");
  const [loaded, setLoaded] = useState(false);

  // load saved progress once, when this is opened as a live shared page
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const raw = localStorage.getItem("collected-cards");
        const res = raw ? { value: raw } : null;
        if (!cancelled && res && res.value) {
          const saved = JSON.parse(res.value);
          if (Array.isArray(saved)) setCollected(saved);
        }
      } catch (e) {
        // no saved progress yet, or storage unavailable in preview — keep demo defaults
      } finally {
        if (!cancelled) setLoaded(true);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // persist progress after the initial load, whenever it changes
  useEffect(() => {
    if (!loaded) return;
    (async () => {
      try {
        localStorage.setItem("collected-cards", JSON.stringify(collected));
      } catch (e) {
        // best-effort only
      }
    })();
  }, [collected, loaded]);

  // let the store button fade in only after the flip animation finishes
  useEffect(() => {
    if (!flipped) return;
    const t = setTimeout(() => setRevealed(true), 750);
    return () => clearTimeout(t);
  }, [flipped]);

  const totalReal = CARD_DEFS.length;
  const collectedCount = collected.length;
  const remainingDefs = CARD_DEFS.filter((c) => !collected.includes(c.id));
  const remainingFreeDefs = remainingDefs.filter((c) => c.free);
  const allFreeFound = remainingFreeDefs.length === 0;
  const allFound = remainingDefs.length === 0;

  const slots = Array.from({ length: PLANNED_TOTAL }).map((_, i) => {
    const def = CARD_DEFS[i];
    return def || { id: `mystery-${i}`, mystery: true };
  });
  const pageCount = Math.ceil(slots.length / PAGE_SIZE);
  const pageSlots = slots.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);

  function startSeek() {
    if (allFreeFound) return;
    const pick = remainingFreeDefs[Math.floor(Math.random() * remainingFreeDefs.length)];
    setFoundId(pick.id);
    setView("seek");
  }

  function openHiddenPage() {
    setFlipped(false);
    setRevealed(false);
    setView("found");
  }

  function revealCard() {
    setFlipped(true);
  }

  function openCodeEntry() {
    setCodeInput("");
    setCodeError("");
    setView("codeEntry");
  }

  function submitCode() {
    const normalized = codeInput.trim();
    if (!normalized) return;
    const match = CARD_DEFS.find((c) => c.code === normalized);
    if (!match) {
      setCodeError("その合言葉には見覚えがないようです……もう一度確かめてみてください。");
      return;
    }
    if (collected.includes(match.id)) {
      setCodeError("そのカードはもうホルダーの中にあります。");
      return;
    }
    setFoundId(match.id);
    setFlipped(false);
    setRevealed(false);
    setView("found");
  }

  function storeCard() {
    const idx = CARD_DEFS.findIndex((c) => c.id === foundId);
    const newCollected = [...collected, foundId];
    setCollected(newCollected);
    setJustAdded(foundId);
    setPage(Math.floor(idx / PAGE_SIZE));
    setView("holder");
    if (newCollected.length === totalReal) {
      setTimeout(() => setShowComplete(true), 700);
    }
    setTimeout(() => setJustAdded(null), 1800);
  }

  function resetAll() {
    setCollected([]);
    setPage(0);
    setView("holder");
    setShowComplete(false);
  }

  const foundDef = CARD_DEFS.find((c) => c.id === foundId);
  const detailDef = CARD_DEFS.find((c) => c.id === detailId);

  return (
    <div className="app">
      <style>{STYLE}</style>

      {view === "holder" && (
        <div className="screen">
          <header className="headerBar">
            <div className="headerTitleWrap">
              <div className="eyebrow">暮らしの森</div>
              <h1 className="headerTitle">住人台帳</h1>
            </div>
            <div className="progressPill">
              <AcornIcon size={16} />
              <span>{collectedCount} / {totalReal}</span>
            </div>
          </header>

          <div className="topActions">
            <button className="seekBtn" onClick={startSeek} disabled={allFreeFound}>
              <KeyIcon size={16} />
              {allFreeFound ? "森を歩いて見つかる鍵は見つけ終えた" : "森を歩いて鍵を探す"}
            </button>
            <button className="codeBtnTop" onClick={openCodeEntry}>
              🔑 合言葉でカードを解放する
            </button>
          </div>

          <div className="progressTrack">
            <div
              className="progressFill"
              style={{ width: `${(collectedCount / totalReal) * 100}%` }}
            />
          </div>
          <div className="progressNote">
            森にはまだ見ぬ仲間が眠っています（全{PLANNED_TOTAL}種予定）
          </div>

          {showComplete && (
            <div className="completeBanner" onClick={() => alert("森の奥、誰も知らない部屋の扉が開いた……\n（おまけストーリーはここに実装されます）")}>
              <SparklesIcon size={16} />
              <span>すべてのカードを見つけました。おまけの話を読む</span>
            </div>
          )}

          <div className="binder">
            <div className="binderRing" />
            <div className="grid">
              {pageSlots.map((slot, i) => {
                const isCollected = !slot.mystery && collected.includes(slot.id);
                const isJust = justAdded === slot.id;
                return (
                  <button
                    key={slot.id || i}
                    className={`slot ${isCollected ? "slotFilled" : "slotEmpty"} ${isJust ? "slotPop" : ""}`}
                    onClick={() => isCollected && setDetailId(slot.id)}
                  >
                    {isCollected ? (
                      <CardFace def={CARD_DEFS.find((c) => c.id === slot.id)} small />
                    ) : (
                      <CardBack mystery={!!slot.mystery} />
                    )}
                  </button>
                );
              })}
            </div>
          </div>

          <div className="pager">
            <button
              className="pagerBtn"
              onClick={() => setPage((p) => Math.max(0, p - 1))}
              disabled={page === 0}
            >
              <ChevronLeftIcon size={18} />
            </button>
            <div className="dots">
              {Array.from({ length: pageCount }).map((_, i) => (
                <span
                  key={i}
                  className={`dot ${i === page ? "dotActive" : ""}`}
                  onClick={() => setPage(i)}
                />
              ))}
            </div>
            <button
              className="pagerBtn"
              onClick={() => setPage((p) => Math.min(pageCount - 1, p + 1))}
              disabled={page === pageCount - 1}
            >
              <ChevronRightIcon size={18} />
            </button>
          </div>

          <div className="footerActions">
            <a
              className="goSeekBtn"
              href="https://note.com/koyorimade/n/n04baadd0b621"
              target="_blank"
              rel="noopener noreferrer"
            >
              🔑を探しにいく
            </a>
          </div>
        </div>
      )}

      {view === "codeEntry" && (
        <div className="overlay">
          <div className="seekCard">
            <KeyIcon size={30} color="#8A5A2E" />
            <p className="seekText">
              森のどこかで見つけた合言葉を、<br />ここに書き記してください。
            </p>
            <input
              className="codeField"
              type="text"
              value={codeInput}
              onChange={(e) => { setCodeInput(e.target.value); setCodeError(""); }}
              placeholder="合言葉"
              autoFocus
            />
            {codeError && <p className="codeError">{codeError}</p>}
            <button className="primaryBtn" onClick={submitCode}>扉を開ける</button>
            <button className="ghostBtn" onClick={() => setView("holder")}>森に戻る</button>
          </div>
        </div>
      )}

      {view === "seek" && (
        <div className="overlay">
          <div className="seekCard">
            <KeyIcon size={30} color="#8A5A2E" />
            <p className="seekText">
              {(foundDef && foundDef.seekFlavor) || "苔むした切り株の下、\n小さな鍵が光っているのを見つけた。"}
            </p>
            <button className="primaryBtn" onClick={openHiddenPage}>
              {(foundDef && foundDef.seekButtonLabel) || "隠しページへ進む"}
            </button>
            <button className="ghostBtn" onClick={() => setView("holder")}>森に戻る</button>
          </div>
        </div>
      )}

      {view === "found" && foundDef && (
        <div className="overlay">
          <div className="revealCard">
            {flipped && <div className="revealGlow" />}
            <div className="flipStage" onClick={!flipped ? revealCard : undefined}>
              <div className={`flipCard ${flipped ? "isFlipped" : ""}`}>
                <div className="flipFace flipFaceBack">
                  <CardBack mystery />
                </div>
                <div className="flipFace flipFaceFront">
                  <CardFace def={foundDef} big />
                </div>
              </div>
            </div>

            {!flipped && (
              <>
                <p className="seekText">
                  {foundDef.foundFlavor || "扉の向こうに、一枚のカードが置かれていた。"}
                </p>
                <button className="primaryBtn" onClick={revealCard}>カードをめくる</button>
              </>
            )}

            {flipped && (
              <button
                className={`primaryBtn ${revealed ? "btnIn" : "btnHidden"}`}
                onClick={storeCard}
                onTransitionEnd={() => {}}
              >
                カードホルダーにしまう
              </button>
            )}
          </div>
        </div>
      )}

      {detailDef && (
        <div className="overlay" onClick={() => setDetailId(null)}>
          <div className="revealCard" onClick={(e) => e.stopPropagation()}>
            <CardFace def={detailDef} big />
            <button className="ghostBtnLight" onClick={() => setDetailId(null)}>
              <XIcon size={14} style={{ marginRight: 4 }} />閉じる
            </button>
          </div>
        </div>
      )}
    </div>
  );
}
